name: Build & push images

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Eerst controleren of het überhaupt compileert. Faalt dit, dan wordt er geen
  # image gebouwd.
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            directory: apps/web
          - name: api
            directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ matrix.directory }}
        run: npm run typecheck

      - name: Build
        working-directory: ${{ matrix.directory }}
        run: npm run build

  # De migraties draaien tegen een echte Postgres, en de api wordt daarna
  # gestart om te controleren dat /healthz de database ziet.
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: depart
          POSTGRES_PASSWORD: depart
          POSTGRES_DB: depart
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U depart"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://depart:depart@localhost:5432/depart
      DOCUMENTS_PATH: /tmp/depart-documents
      PORT: 8080

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install
        working-directory: apps/api
        run: npm ci

      - name: Migrate
        working-directory: apps/api
        run: npm run migrate

      - name: Migrate opnieuw (moet niets doen)
        working-directory: apps/api
        run: npm run migrate

      - name: Build
        working-directory: apps/api
        run: npm run build

      - name: Start de api en controleer /healthz
        working-directory: apps/api
        run: |
          node dist/index.js &
          api_pid=$!
          for poging in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${PORT}/healthz" > /tmp/healthz.json; then
              break
            fi
            sleep 1
          done
          kill "$api_pid" || true
          cat /tmp/healthz.json
          grep -q '"database":"ok"' /tmp/healthz.json

  build:
    runs-on: ubuntu-latest
    needs:
      - check
      - migrations

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: web
            context: ./apps/web
          - name: api
            context: ./apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/depart-${{ matrix.name }}
          tags: |
            # Branch tag (niet voor main)
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

            # PR tags
            type=ref,event=pr

            # Git release tags
            type=semver,pattern={{version}}

            # Immutable tag
            type=sha,format=short

            # Alleen main krijgt latest
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
